<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Каталог с обновлениями</title>
<style>body{font:16px system-ui;max-width:760px;margin:32px auto;padding:0 16px}li{padding:12px 0;border-bottom:1px solid #ddd}</style>
<h1>Опубликованный каталог</h1><p id="status">Подключение…</p><ul id="products"></ul>
<script type="module">
const status = document.querySelector('#status');
const products = document.querySelector('#products');
let refreshing = false, pending = false;
async function refresh() {
  if (refreshing) { pending = true; return; }
  refreshing = true;
  try {
    do {
      pending = false;
      const response = await fetch('/catalog');
      if (!response.ok) throw new Error('Каталог временно недоступен');
      const catalog = await response.json();
      const rows = catalog.products.map(product => {
        const row = document.createElement('li');
        row.textContent = `${product.name} · ${product.price ?? 'Цена не задана'} · Доступно: ${product.available ?? '—'}`;
        return row;
      });
      products.replaceChildren(...rows);
      status.textContent = 'Каталог обновлён';
    } while (pending);
  } catch (error) { status.textContent = error.message; }
  finally { refreshing = false; }
}
const events = new EventSource('/events');
events.addEventListener('catalog.changed', refresh);
events.onerror = () => { status.textContent = 'Восстанавливаем соединение…'; };
window.addEventListener('pagehide', () => events.close());
await refresh();
</script>
</html>
