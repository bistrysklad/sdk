name: SDK CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: bistrysklad-sdk-*.tgz
