name: Publish npm
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and npm CLI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.RELEASE_TAG!==`v${p.version}`)throw new Error("Release tag differs from package version");'
          npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run generate:check
      - run: npm test
      - run: npm run package:check
      - name: Publish with GitHub OIDC and provenance
        run: npm publish --access public --provenance
